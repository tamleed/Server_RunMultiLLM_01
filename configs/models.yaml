models:
  - name: gpt-oss120
    source:
      type: huggingface_repo
      value: openai/gpt-oss-120b
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      gpus: "all"
      vllm_args:
        - --dtype=bfloat16
        - --max-model-len=8192
        - --gpu-memory-utilization=0.92
        - --tensor-parallel-size=1
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models
    notes: Tune tensor_parallel_size for multi-GPU A100.

  - name: qwen3-30b
    source:
      type: huggingface_repo
      value: Qwen/Qwen3-30B-A3B-Instruct-2507
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      gpus: "all"
      vllm_args:
        - --dtype=bfloat16
        - --max-model-len=8192
        - --gpu-memory-utilization=0.9
        - --tensor-parallel-size=1
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models
    notes: Good default model for smoke tests.

  - name: qwen3-235b-4bit
    source:
      type: huggingface_repo
      value: Qwen/Qwen3-235B-A22B-FP8
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      gpus: "device=0,1"
      vllm_args:
        - --dtype=auto
        - --quantization=awq
        - --max-model-len=32768
        - --gpu-memory-utilization=0.95
        - --tensor-parallel-size=2
        - --pipeline-parallel-size=1
        - --swap-space=16
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models
    notes: Verify quantization format compatibility with selected checkpoint.
